<meta property="og:title" content="Read Us! 리더스 · 독서기록장">
<meta property="og:description" content="한 권 한 권 쌓아 내 키만큼, 교실 천장까지. 학생 휴대폰으로 기록하고, 선생님이 승인하면 우리 반 책탑이 쌓여요.">

<style>
:root{--paper:#F4EBDD;--card:#FFFCF6;--ink:#3E2C20;--sub:#6E5847;--line:#DCCDB8;--line2:#B9A58C;--wood:#4E392B;--soft:#EFE4D2;--mustard:#E8B84E;--butter:#FBEBC4;--sage:#5E9C8A;--sagebg:#DDEBD3;--peach:#F8DCC8;--cream:#E9DCC8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Gowun Batang',serif;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:none;border:0;padding:8px 16px 8px 8px;margin:-8px 0 -8px -8px;border-radius:16px;text-align:left}
.brand img{width:46px;height:46px;flex:none;display:block;border-radius:10px}
.brand b{font-family:'Gowun Batang',serif;font-size:22px}
.brand small{display:block;font-size:12px;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:var(--card);font-weight:700}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.small{min-height:44px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:18px;padding:18px 20px}
.dark{background:var(--ink);color:var(--card)}
.muted{color:var(--sub);font-size:13px}
.dark .muted{color:var(--cream)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--butter);white-space:nowrap}
.pill.wait{background:var(--peach)}.pill.ok{background:var(--sagebg)}.pill.back{background:#F3D2D2}
.grid2{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 6px}
.in{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in:focus,.btn:focus-visible,.name:focus-visible,.q:focus-visible,.found:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--sage)}
.cover{flex:0 0 60px;width:60px;height:84px;border-radius:4px 8px 8px 4px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Jua,sans-serif;font-size:12px;line-height:1.2;padding:4px;overflow:hidden;color:var(--ink);border-left:6px solid rgba(62,44,32,.25)}
img.cover{object-fit:cover;padding:0;border-left:0;display:block}
.cvbtn{flex:0 0 60px;align-self:flex-start;padding:0;border:0;background:none;border-radius:4px 8px 8px 4px;cursor:zoom-in;transition:transform .08s ease,box-shadow .12s ease}
.cvbtn:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(62,44,32,.28)}
.cvbtn:active{transform:translateY(1px) scale(.98);box-shadow:none}
.cvbtn:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.cvbig{width:auto;min-width:120px;min-height:174px;height:min(62vh,348px);max-width:78vw;object-fit:contain;border-radius:6px 12px 12px 6px;box-shadow:0 8px 24px rgba(62,44,32,.3);background:var(--soft)}
.cb{display:flex;gap:14px}
.cb .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
/* 현황판 */
.tower{flex:3 1 420px;background:var(--wood);color:var(--card);border-radius:20px;padding:24px;display:flex;gap:16px;justify-content:center;overflow:hidden}
.tower svg{flex:none}
.tower svg:first-child{position:relative;z-index:1}
.marks{position:relative;width:170px;min-width:150px;height:500px;flex:0 1 170px}
.marks div{position:absolute;left:0;transform:translateY(-50%);display:flex;flex-direction:column;line-height:1.3}
.marks strong{font-size:14px;color:var(--cream);white-space:nowrap}
.marks span{font-size:12px;color:var(--cream)}
.marks .goal strong{color:var(--mustard);font-size:15px}
.marks .now strong{color:var(--card);font-size:17px}
.side{flex:2 1 340px;display:flex;flex-direction:column;gap:14px;min-width:0}
.rank{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:4px 6px;margin:0 -6px;border-radius:10px;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .15s}
.rank:hover{background:var(--butter)}.rank:active{transform:scale(.99)}
.rank span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.log{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:64px 1fr;gap:14px}
.log:first-of-type{border-top:0;padding-top:0}
.log .cover{width:64px;height:92px}
.log .note{white-space:pre-wrap;line-height:1.7;margin:8px 0 0;background:var(--paper);border-radius:12px;padding:10px 12px}
.log .memo{margin:6px 0 0;font-size:14px;color:var(--sub)}
.mrow{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center}.mrow .bar{height:16px}
@media (max-width:560px){.log{grid-template-columns:48px 1fr;gap:10px}.log .cover{width:48px;height:70px}}
.rank .bar{height:18px}
.headline{font-size:30px}
/* 학생 이름 고르기 */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.name{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700}
.name small{display:block;font-weight:400;color:var(--sub);font-size:12px}
/* 선생님 메뉴 (왼쪽 메뉴 + 오른쪽 칸) */
.adm{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.menu{flex:0 0 230px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mi{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:none;font-weight:700;text-align:left;width:100%}
.mi i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mi span:first-of-type{flex:1}
.mi[aria-current="page"]{background:var(--peach);color:#8E3A22}
.mi[aria-current="page"] i{background:#C65D3B}
.badge{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#C65D3B;color:#FFFCF6;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.pane{flex:1 1 420px;min-width:0;padding:0}
.ph{display:flex;align-items:center;gap:10px;font-size:19px;padding:18px 22px;border-bottom:1px solid var(--line)}
.ph i{width:9px;height:9px;border-radius:50%;background:#C65D3B}
.pb{padding:20px 22px}
.pb,.ph{animation:fadein .16s ease}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.item{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card)}
.helpbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;background:none;padding:0 6px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;border-radius:8px}
.helpbtn .qm{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);font-size:13px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.helpbtn:hover{text-decoration:underline}.helpbtn:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
#nav .helpbtn.end{margin-left:8px}
@media (max-width:640px){#nav{width:100%}#nav .helpbtn.end{margin-left:auto}}
.menu .helpbtn{margin-top:10px;padding:8px 14px;justify-content:flex-start}
.sheet.help{max-width:620px}
.sheet.help section{border-top:1px solid var(--line);padding-top:10px}
.sheet.help h3{font-size:16px;display:flex;align-items:center;gap:8px;margin:0 0 6px}
.sheet.help h3 .num{width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--card);font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sheet.help ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.sheet.help li{font-size:14px;line-height:1.55}
.textlink{min-height:44px;padding:0 6px;border:0;background:none;color:var(--sub);font-weight:700;border-radius:8px}
summary{cursor:pointer;min-height:32px;border-radius:8px}
/* 마우스를 올리거나 누를 때 */
.btn,.mi,.name,.q,.found,.textlink,.brand,summary{transition:transform .08s ease,background-color .12s ease,box-shadow .12s ease,color .12s ease}
.btn:hover:not(:disabled){background:#5A4232;box-shadow:0 3px 10px rgba(62,44,32,.22);transform:translateY(-1px)}
.btn.line:hover:not(:disabled){background:var(--soft);box-shadow:0 3px 10px rgba(62,44,32,.12)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98);box-shadow:none}
.mi:hover{background:var(--soft)}
.mi[aria-current="page"]:hover{background:#F3CDB4}
.mi:active{transform:scale(.98)}
.name:hover,.q:hover,.found:hover{background:var(--soft);border-color:var(--line2);box-shadow:0 3px 10px rgba(62,44,32,.12);transform:translateY(-1px)}
.name:active,.q:active,.found:active{transform:translateY(1px) scale(.98);box-shadow:none}
.textlink:hover{color:var(--ink);background:var(--soft)}
.textlink:active{transform:scale(.97)}
.brand:hover{background:var(--card);box-shadow:0 3px 10px rgba(62,44,32,.14);transform:translateY(-1px)}
.brand:active{transform:translateY(1px) scale(.98);box-shadow:none;background:var(--soft)}
.brand:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
summary:hover{color:#8E3A22}
.mi:focus-visible,.textlink:focus-visible,summary:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.pb,.ph{animation:none}.btn,.mi,.name,.q,.found,.textlink,.brand,summary{transition:none}.btn:hover,.name:hover,.q:hover,.found:hover,.brand:hover,.btn:active,.mi:active,.name:active,.q:active,.found:active,.brand:active{transform:none}}
@media (max-width:760px){.menu{flex:1 1 100%;flex-direction:row;flex-wrap:wrap}.mi{width:auto;flex:1 1 44%}}
/* 아래에서 올라오는 창 */
.shade{position:fixed;inset:0;background:rgba(62,44,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.q{min-height:44px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.found{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.found img,.found .noimg{flex:0 0 34px;width:34px;height:46px;border-radius:3px;object-fit:cover;background:var(--soft)}
.shade.mid{align-items:center;padding:16px}
.qrbox{background:var(--card);border-radius:24px;padding:26px 28px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;max-width:min(92vw,560px);max-height:94vh;overflow:auto}
.qrimg{width:min(60vh,78vw,440px);height:auto;border-radius:12px;border:1px solid var(--line)}
/* 목표 축하 */
.conf{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:21}
.conf i{position:absolute;top:-24px;width:12px;height:18px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
/* 인쇄: 독서기록장만 */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap,#modal,#toast{display:none!important}
  #print{display:block;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:11pt;line-height:1.5}
  #print section{page-break-after:always;break-after:page}
  #print section:last-child{page-break-after:auto;break-after:auto}
  #print h1{font-family:'Gowun Batang',serif;font-size:20pt;margin:0 0 2pt}
  #print .sum{margin:0 0 12pt;color:#333}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border:1px solid #888;padding:5pt 6pt;text-align:left;vertical-align:top}
  #print th{background:#eee}
  #print tr{break-inside:avoid;page-break-inside:avoid}
  #print .n{white-space:pre-wrap;word-break:break-word}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;z-index:30;max-width:90vw;display:none}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--sub)}
.note{white-space:pre-wrap;word-break:break-word;margin:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
@media (max-width:560px){.headline{font-size:24px}.tower{padding:16px 10px;gap:8px}.marks{width:120px}.cmp{display:none}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <button class="brand" id="home" type="button" aria-label="처음 화면으로">
      <img src="icons/icon.svg" alt="" width="46" height="46">
      <span><b>Read Us! 리더스</b><small id="cls"></small></span>

  <main id="app" aria-live="polite"></main>
  <p class="foot"><button class="textlink" type="button" id="inst">앱으로 설치하기</button><br>Made by 음악적체육인 · 리더스 <span id="ver"></span></p>

<script>
'use strict';
var TEMPLATE_URL = 'https://docs.google.com/spreadsheets/d/1i-lr4aewTmhj4eJ-hfXgjxaPzflmMyLMn-aqUepZjls/copy';   // 껍데기가 들어 있는 견본 시트 (사본 만들기)
// 주소에 ?demo 가 붙으면 설치 없이 둘러보는 미리보기 — 지어낸 학급을 이 브라우저 안에서만 돌림 (demo.js)
var DEMO = new URLSearchParams(location.search).has('demo');
var APP = { version: '1.2.0', requiredShell: 1, latestShell: 2, s: '', ping: null, settings: null, relay: '', token: '', me: null };

/* ---------- 작은 도구 ---------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3200); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dueText(due) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(due || '')) return '';
  var p = due.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]), t = new Date(); t.setHours(0, 0, 0, 0);
  var left = Math.round((d - t) / 86400000), day = '일월화수목금토'[d.getDay()];
  var base = p[1] + '월 ' + p[2] + '일(' + day + ')까지';
  return left > 0 ? base + ' · ' + left + '일 남음' : left === 0 ? base + ' · 오늘까지' : base;
}
// 견본 시트의 사본은 이름 끝에 '의 사본'이 붙으므로 화면에서는 떼고 보여 줌
function classTitle(t) { return String(t || '').replace(/\s*의 사본(\s*\(\d+\))?\s*$/, '').replace(/^Copy of\s+/i, '').trim(); }
// 책 한 권 = 실제 두께쯤인 2cm 로 쌓음 (눕혀 쌓은 그림과 맞게). 껍데기가 알려 주는 옛 값(30)은 쓰지 않음
var BOOK_CM = 2;
function hText(cm) {
  if (cm < 100) return Math.round(cm) + 'cm';
  if (cm < 1000) { var m = Math.floor(cm / 100), r = Math.round(cm - m * 100); return r ? m + 'm ' + r + 'cm' : m + 'm'; }
  if (cm < 100000) return (Math.round(cm / 10) / 10) + 'm';
  return (Math.round(cm / 1000) / 100) + 'km';
}
function heightText(count) { return hText(count * BOOK_CM); }

/* ---------- 학교 시트(껍데기)와 주고받기 ---------- */
async function rpcOnce(fn, args) {
  if (DEMO) return READUS_DEMO.call(fn, args);
  var res = await fetch(APP.s, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) });
  if (!res.ok) { var e = new Error('학교 시트와 연결이 잠시 끊겼어요. (' + res.status + ')'); e.retry = true; throw e; }
  var out = await res.json();
  if (!out.ok) throw new Error(out.error || '요청을 처리하지 못했어요.');
  return out.result;
}
async function rpc(fn, args) {
  try { return await rpcOnce(fn, args); }
  catch (e) {
    if (!(e.retry || e instanceof TypeError)) throw e;
    await sleep(1500);
    try { return await rpcOnce(fn, args); } catch (e2) { throw (e2 instanceof TypeError) ? new Error('학교 시트와 연결하지 못했어요. 인터넷을 확인해 주세요.') : e2; }
  }
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(e.message || String(e)); return undefined; } }

/* ---------- 사용 안내 (휘슬과 같은 방식: 어느 화면에서나 "? 사용 안내") ---------- */
var HELP = [

/* ---------- 접속 QR (학생 휴대폰으로 찍어 바로 들어오기) ---------- */
function studentLink() { return location.origin + location.pathname + (DEMO ? '?demo' : '?s=' + encodeURIComponent(APP.s)) + '#student'; }
function qrSvg(text) {
  if (typeof qrcode !== 'function') return '';
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), m = 3, d = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg class="qrimg" viewBox="0 0 ' + (n + m * 2) + ' ' + (n + m * 2) + '" role="img" aria-label="접속 QR" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#FFFFFF"/><path d="' + d + '" fill="#3E2C20"/></svg>';
}
function showQr() {
  var link = studentLink(), svg = qrSvg(link);
  $('#modal').innerHTML = '<div class="shade mid" id="qrs"><div class="qrbox" role="dialog" aria-labelledby="qrt"><h2 id="qrt">' + esc(classTitle($('#cls').textContent) || '우리 반') + ' 리더스에 들어오기</h2><p style="margin:0">휴대폰 카메라로 찍으면 바로 이름 고르는 화면이 열려요.</p>' +
    (svg || '<p class="muted">QR을 만들 도구를 불러오지 못했어요. 새로 고친 뒤 다시 눌러 주세요.</p>') +
    '<div class="row" style="justify-content:center"><button class="btn line" type="button" id="qrc">주소 복사</button><button class="btn" type="button" id="qrx">닫기</button></div></div></div>';
  $('#qrx').onclick = function () { $('#modal').innerHTML = ''; };
  $('#qrs').onclick = function (ev) { if (ev.target === ev.currentTarget) $('#modal').innerHTML = ''; };
  $('#qrc').onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { toast('주소를 복사했어요.'); }, function () { toast('주소 복사가 안 되는 기기예요. 선생님 메뉴의 주소 칸을 이용해 주세요.'); }); };
  $('#qrx').focus();
}

/* ---------- 책탑 그림 ---------- */
var BOOKC = ['#D2604A', '#E39A4A', '#E8B84E', '#5E9C8A', '#7E9BB8', '#B8566B', '#F2E6D0'];
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// fill: 0~1 (다음 목표까지 얼마나 찼는지), exact: 책이 적을 때 실제 권수(한 권이 그림 한 권)
// 책 그림 12권(img/books/b01~b12.webp) — [앞면이 시작되는 높이 비율, 앞면이 끝나는 높이 비율, 앞면 두께÷너비]
var BOOKS = [[0.175,1.0,0.1444],[0.33,0.968,0.0877],[0.35,0.994,0.0648],[0.213,0.996,0.1293],[0.153,0.721,0.133],[0.215,0.985,0.1275],[0.347,0.994,0.0704],[0.234,0.996,0.1164],[0.188,0.984,0.1517],[0.296,0.994,0.0774],[0.181,1.0,0.1508],[0.167,0.996,0.1452]];
function towerSvg(fill, exact) {
  var W = 210, H = 500, fillPx = Math.max(0, Math.min(1, fill)) * H, r = rng(23);
  var list = [], sum = 0, p1 = -1, p2 = -1;
  function next() { var i; do { i = Math.floor(r() * BOOKS.length); } while (i === p1 || i === p2); p2 = p1; p1 = i; return i; }
  if (exact) {   // 한 권이 그림 한 권 — 두꺼운 책·얇은 책이 섞이되 합은 정확히 맞춤
    var ws = 0; for (var e = 0; e < exact; e++) { var bi = next(), wg = Math.pow(BOOKS[bi][2], 0.6); list.push({ i: bi, g: wg }); ws += wg; }
    list.forEach(function (b) { b.h = fillPx * b.g / ws; });
  } else {
    while (fillPx - sum >= 12) { var bj = next(), hh = Math.min(Math.max(14, Math.min(26, 176 * BOOKS[bj][2])), fillPx - sum); if (fillPx - sum - hh < 12) hh = fillPx - sum; list.push({ i: bj, h: hh }); sum += hh; }
    if (!list.length && fillPx > 0) list.push({ i: next(), h: Math.max(8, fillPx) });
  }
  var out = ['<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="우리 반 책탑" data-n="' + list.length + '"><line x1="0" y1="1" x2="' + W + '" y2="1" stroke="#E8B84E" stroke-width="2" stroke-dasharray="6 5"/>'];
  var y = H;
  list.forEach(function (b) {
    var m = BOOKS[b.i], h = b.h; y -= h;
    var w = Math.max(150, Math.min(194, h / m[2])), x = (W - w) / 2 + Math.floor(r() * 13) - 6;
    x = Math.max(0, Math.min(W - w, x));
    var ih = h / (m[1] - m[0]), iy = y - m[0] * ih, flip = r() < 0.4;
    out.push('<image href="img/books/b' + (b.i < 9 ? '0' : '') + (b.i + 1) + '.webp" x="' + x.toFixed(1) + '" y="' + iy.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + ih.toFixed(1) + '" preserveAspectRatio="none"' + (flip ? ' transform="matrix(-1 0 0 1 ' + (2 * x + w).toFixed(1) + ' 0)"' : '') + '/>');
  });
  out.push('</svg>');
  return out.join('');
}

function coverHtml(b) {

  var n = 0, t = String(b.title || ''); for (var i = 0; i < t.length; i++) n = (n * 31 + t.charCodeAt(i)) >>> 0;
  return '<div class="cover" style="background:' + BOOKC[n % (BOOKC.length - 1)] + '" aria-hidden="true">' + esc(t.slice(0, 12)) + '</div>';
}
// 표지를 누르면 크게 보기. 책 검색이 준 주소는 작은 그림(120x174)이라, 더 큰 그림이 있을 만한 주소들을 함께 불러 보고 가장 큰 것을 보여 줌
function coverCandidates(u) {
  u = String(u); var list = [], m = u.match(/[?&]fname=([^&]+)/);
  if (m) { try { var orig = decodeURIComponent(m[1]).replace(/^http:/, 'https:'); if (/^https:\/\//.test(orig)) list.push(orig); } catch (e) {} }   // 줄이기 전 원본 그림
  if (/\/thumb\/[A-Z]\d+x\d+/.test(u)) { list.push(u.replace(/\/thumb\/[A-Z]\d+x\d+(\.q\d+)?\//, '/thumb/R600x0.q90/')); list.push(u.replace(/\/thumb\/[A-Z]\d+x\d+(\.q\d+)?\//, '/thumb/R480x696.q85/')); }
  list.push(u);
  return list.filter(function (x, k) { return list.indexOf(x) === k; });
}
function showCover(src, title, meta) {
  $('#modal').innerHTML = '<div class="shade mid" id="cvs"><div class="qrbox" role="dialog" aria-label="' + esc(title) + ' 표지"><img class="cvbig" id="cvi" alt="' + esc(title) + ' 표지" referrerpolicy="no-referrer"><strong style="font-size:18px">' + esc(title) + '</strong>' + (meta ? '<span class="muted">' + esc(meta) + '</span>' : '') + '<button class="btn" type="button" id="cvx">닫기</button></div></div>';
  var img = $('#cvi'), best = 0;
  function use(url, w, h) {
    if (!document.body.contains(img) || w <= best) return;
    best = w; img.src = url; img.style.height = 'min(62vh,' + Math.round(Math.min(560, h * 2)) + 'px)';   // 작은 그림은 두 배까지만 키움 (너무 흐려지지 않게)
  }
  coverCandidates(src).forEach(function (url) {
    var t = new Image(); t.referrerPolicy = 'no-referrer';
    t.onload = function () { use(url, t.naturalWidth, t.naturalHeight); };
    t.src = url;

}

      var list = await (await fetch('changelog.json', { cache: 'no-cache' })).json();
      if (!$('#logl')) return;
      $('#logl').innerHTML = list.map(function (v, i) { return '<details class="item"' + (i === 0 ? ' open' : '') + '><summary><strong>' + esc(v.version) + '</strong> <span class="muted">' + esc(v.date) + '</span></summary><ul style="margin:8px 0 0;padding-left:20px">' + v.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>'; }).join('');
    } catch (e) { if ($('#logl')) $('#logl').innerHTML = '<span class="muted">업데이트 내역을 불러오지 못했어요.</span>'; }
  }
};

/* ---------- 시작 ---------- */
function connectScreen(msg) {
  $('#nav').innerHTML = '';
  $('#app').innerHTML = '<form class="card" id="cn" style="max-width:560px;margin:0 auto"><h1 style="font-size:22px">학교 시트와 연결하기</h1><p>' + esc(msg || '선생님이 알려 준 주소로 들어오면 바로 열려요. 처음 설치하는 선생님은 껍데기를 배포하고 받은 주소(…/exec)를 아래에 붙여 넣어 주세요.') + '</p><label class="f" for="su">껍데기 주소</label><input class="in" id="su" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><button class="btn wide" type="submit" style="margin-top:12px">연결</button></form>' +
    '<div class="card" style="max-width:560px;margin:14px auto 0"><strong style="font-size:17px">처음 설치하는 선생님</strong><p>껍데기가 들어 있는 견본 시트의 사본을 만들면 붙여 넣기 없이 바로 배포할 수 있어요.</p><a class="btn wide" id="tpl" href="' + TEMPLATE_URL + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">견본 시트 사본 만들기</a><p class="muted">사본을 만든 뒤 확장 프로그램 → Apps Script → 배포 → 새 배포(웹 앱)까지 하면 주소가 나옵니다. <a href="https://github.com/MusicalPE/readus#readme" target="_blank" rel="noopener">설치 방법 자세히 보기</a></p></div>';
  $('#cn').onsubmit = function (ev) {
    ev.preventDefault();
    var u = $('#su').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u) && !/^http:\/\/localhost[:/]/.test(u)) { toast('…/exec 로 끝나는 껍데기 주소를 넣어 주세요.'); return; }
    location.search = '?s=' + encodeURIComponent(u);
  };
}
// 미리보기 안내 띠
function demoBar() {
  var b = document.createElement('div');
  b.id = 'demobar';
  b.textContent = '미리보기 · 지어낸 학급이에요. 눌러 본 내용은 저장되지 않고, 새로 고치면 처음으로 돌아가요. 선생님 비밀번호는 아무거나 넣어도 들어가져요.';
  b.style.cssText = 'background:#3E2C20;color:#FFF6E4;font-size:13px;line-height:1.5;text-align:center;padding:7px 12px';
  document.body.insertBefore(b, document.body.firstChild);
}
async function start() {
  $('#ver').textContent = APP.version;
  var q = new URLSearchParams(location.search), s = q.get('s') || '';
  if (DEMO) s = 'demo';
  try { if (!s) s = localStorage.getItem('ru_shell') || ''; } catch (e) {}
  if (!s) { connectScreen(); return; }
  APP.s = s;
  try {
    var got = await Promise.all([rpc('ping'), rpc('getSettings')]);
    APP.ping = got[0]; APP.settings = got[1];
  } catch (e) { connectScreen('학교 시트와 연결하지 못했어요. 주소를 다시 확인해 주세요. (' + (e.message || e) + ')'); return; }
  if (!DEMO) { try { localStorage.setItem('ru_shell', s); APP.token = sessionStorage.getItem('ru_token|' + s) || ''; } catch (e) {} }
  // 주소에 학교 시트가 빠져 있으면 채워 둠 — 홈 화면에 추가하거나 주소를 복사해도 우리 반으로 열리게
  if (!q.get('s') && !DEMO) { try { history.replaceState(null, '', location.pathname + '?s=' + encodeURIComponent(s) + location.hash); } catch (e) {} }
  $('#cls').textContent = classTitle(APP.ping.title);
  if (APP.ping.shell < APP.requiredShell) toast('껍데기를 새 판으로 바꿔야 해요. 선생님께 알려 주세요.');
  if (DEMO) { APP.relay = 'demo'; demoBar(); }
  else { try { var rj = await (await fetch('relay.json', { cache: 'no-cache' })).json(); if (/^https?:\/\//.test(rj.relay || '')) APP.relay = rj.relay; } catch (e) {} }
  render();
}
/* ---------- 앱으로 설치 ---------- */
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// 아이폰·아이패드는 설치 설명 파일이 있으면 학교 주소(?s=)를 떼고 저장하므로, 지금 주소 그대로 저장되도록 설명 파일을 뺌
if (IS_IOS && $('#mf')) $('#mf').remove();
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); APP.install = e; });
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('#inst').style.display = 'none';
$('#inst').onclick = function () {
  var how = APP.install ? '<button class="btn wide" type="button" id="insgo">지금 설치하기</button>'
    : IS_IOS ? '<ol style="margin:0;padding-left:20px;text-align:left"><li>Safari 아래쪽의 <b>공유</b> 단추를 누릅니다.</li><li><b>홈 화면에 추가</b>를 누릅니다.</li><li>오른쪽 위 <b>추가</b>를 누르면 리더스 아이콘이 생깁니다.</li></ol>'
    : '<ol style="margin:0;padding-left:20px;text-align:left"><li>브라우저 오른쪽 위 <b>메뉴(점 세 개)</b>를 누릅니다.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누릅니다.</li><li>컴퓨터에서는 주소 칸 오른쪽의 설치 아이콘을 눌러도 됩니다.</li></ol>';
  $('#modal').innerHTML = '<div class="shade mid" id="inss"><div class="qrbox" role="dialog" aria-labelledby="inst1"><img src="icons/icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 id="inst1">리더스를 앱처럼 쓰기</h2><p style="margin:0">홈 화면에 아이콘을 만들어 두면 QR을 찍지 않고 바로 우리 반으로 들어와요.</p>' + how + '<button class="btn line wide" type="button" id="insx">닫기</button></div></div>';
  $('#insx').onclick = function () { $('#modal').innerHTML = ''; };
  $('#inss').onclick = function (ev) { if (ev.target === ev.currentTarget) $('#modal').innerHTML = ''; };
  if ($('#insgo')) $('#insgo').onclick = function () { var p = APP.install; APP.install = null; $('#modal').innerHTML = ''; if (p) p.prompt(); };
};
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}
start();
</script>
</body>
</html>
