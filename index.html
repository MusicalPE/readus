<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Us! 리더스</title>
<meta name="description" content="읽은 책을 쌓아 우주까지 — 학급 독서기록장">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--paper:#F4EBDD;--card:#FFFCF6;--ink:#3E2C20;--sub:#6E5847;--line:#DCCDB8;--line2:#B9A58C;--wood:#4E392B;--soft:#EFE4D2;--mustard:#E8B84E;--butter:#FBEBC4;--sage:#5E9C8A;--sagebg:#DDEBD3;--peach:#F8DCC8;--cream:#E9DCC8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Gowun Batang',serif;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:none;border:0;padding:8px 16px 8px 8px;margin:-8px 0 -8px -8px;border-radius:16px;text-align:left}
.brand img{width:46px;height:46px;flex:none;display:block;border-radius:10px}
.brand b{font-family:'Gowun Batang',serif;font-size:22px}
.brand small{display:block;font-size:12px;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:var(--card);font-weight:700}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.small{min-height:44px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:18px;padding:18px 20px}
.dark{background:var(--ink);color:var(--card)}
.muted{color:var(--sub);font-size:13px}
.dark .muted{color:var(--cream)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--butter);white-space:nowrap}
.pill.wait{background:var(--peach)}.pill.ok{background:var(--sagebg)}.pill.back{background:#F3D2D2}
.grid2{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 6px}
.in{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in:focus,.btn:focus-visible,.name:focus-visible,.q:focus-visible,.found:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--sage)}
.cover{flex:0 0 60px;width:60px;height:84px;border-radius:4px 8px 8px 4px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Jua,sans-serif;font-size:12px;line-height:1.2;padding:4px;overflow:hidden;color:var(--ink);border-left:6px solid rgba(62,44,32,.25)}
img.cover{object-fit:cover;padding:0;border-left:0}
.cb{display:flex;gap:14px}
.cb .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
/* 현황판 */
.tower{flex:3 1 420px;background:var(--wood);color:var(--card);border-radius:20px;padding:24px;display:flex;gap:16px;justify-content:center;overflow:hidden}
.tower svg{flex:none}
.marks{position:relative;width:170px;min-width:120px;height:500px;flex:0 1 170px}
.marks div{position:absolute;left:0;transform:translateY(-50%);display:flex;flex-direction:column;line-height:1.3}
.marks strong{font-size:14px;color:var(--cream)}
.marks span{font-size:12px;color:var(--cream)}
.marks .goal strong{color:var(--mustard);font-size:15px}
.marks .now strong{color:var(--card);font-size:17px}
.side{flex:2 1 340px;display:flex;flex-direction:column;gap:14px;min-width:0}
.rank{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center}
.rank .bar{height:18px}
.headline{font-size:30px}
/* 학생 이름 고르기 */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.name{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700}
.name small{display:block;font-weight:400;color:var(--sub);font-size:12px}
/* 선생님 메뉴 (왼쪽 메뉴 + 오른쪽 칸) */
.adm{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.menu{flex:0 0 230px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mi{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:none;font-weight:700;text-align:left;width:100%}
.mi i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mi span:first-of-type{flex:1}
.mi[aria-current="page"]{background:var(--peach);color:#8E3A22}
.mi[aria-current="page"] i{background:#C65D3B}
.badge{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#C65D3B;color:#FFFCF6;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.pane{flex:1 1 420px;min-width:0;padding:0}
.ph{display:flex;align-items:center;gap:10px;font-size:19px;padding:18px 22px;border-bottom:1px solid var(--line)}
.ph i{width:9px;height:9px;border-radius:50%;background:#C65D3B}
.pb{padding:20px 22px}
.pb,.ph{animation:fadein .16s ease}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.item{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card)}
.textlink{min-height:44px;padding:0 6px;border:0;background:none;color:var(--sub);font-weight:700;border-radius:8px}
summary{cursor:pointer;min-height:32px;border-radius:8px}
/* 마우스를 올리거나 누를 때 */
.btn,.mi,.name,.q,.found,.textlink,.brand,summary{transition:transform .08s ease,background-color .12s ease,box-shadow .12s ease,color .12s ease}
.btn:hover:not(:disabled){background:#5A4232;box-shadow:0 3px 10px rgba(62,44,32,.22);transform:translateY(-1px)}
.btn.line:hover:not(:disabled){background:var(--soft);box-shadow:0 3px 10px rgba(62,44,32,.12)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98);box-shadow:none}
.mi:hover{background:var(--soft)}
.mi[aria-current="page"]:hover{background:#F3CDB4}
.mi:active{transform:scale(.98)}
.name:hover,.q:hover,.found:hover{background:var(--soft);border-color:var(--line2);box-shadow:0 3px 10px rgba(62,44,32,.12);transform:translateY(-1px)}
.name:active,.q:active,.found:active{transform:translateY(1px) scale(.98);box-shadow:none}
.textlink:hover{color:var(--ink);background:var(--soft)}
.textlink:active{transform:scale(.97)}
.brand:hover{background:var(--card);box-shadow:0 3px 10px rgba(62,44,32,.14);transform:translateY(-1px)}
.brand:active{transform:translateY(1px) scale(.98);box-shadow:none;background:var(--soft)}
.brand:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
summary:hover{color:#8E3A22}
.mi:focus-visible,.textlink:focus-visible,summary:focus-visible{outline:3px solid var(--mustard);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.pb,.ph{animation:none}.btn,.mi,.name,.q,.found,.textlink,.brand,summary{transition:none}.btn:hover,.name:hover,.q:hover,.found:hover,.brand:hover,.btn:active,.mi:active,.name:active,.q:active,.found:active,.brand:active{transform:none}}
@media (max-width:760px){.menu{flex:1 1 100%;flex-direction:row;flex-wrap:wrap}.mi{width:auto;flex:1 1 44%}}
/* 아래에서 올라오는 창 */
.shade{position:fixed;inset:0;background:rgba(62,44,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.q{min-height:44px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.found{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.found img,.found .noimg{flex:0 0 34px;width:34px;height:46px;border-radius:3px;object-fit:cover;background:var(--soft)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;z-index:30;max-width:90vw;display:none}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--sub)}
.note{white-space:pre-wrap;word-break:break-word;margin:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
@media (max-width:560px){.headline{font-size:24px}.tower{padding:16px 10px;gap:8px}.marks{width:120px}.cmp{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" id="home" type="button" aria-label="처음 화면으로">
      <img src="icons/icon.svg" alt="" width="46" height="46">
      <span><b>Read Us! 리더스</b><small id="cls"></small></span>
    </button>
    <div class="row" id="nav"></div>
  </div>
  <main id="app" aria-live="polite"></main>
  <p class="foot">Made by 음악적체육인 · 리더스 <span id="ver"></span></p>
</div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
'use strict';
var TEMPLATE_URL = 'https://docs.google.com/spreadsheets/d/1i-lr4aewTmhj4eJ-hfXgjxaPzflmMyLMn-aqUepZjls/copy';   // 껍데기가 들어 있는 견본 시트 (사본 만들기)
var APP = { version: '0.3.0', requiredShell: 1, latestShell: 2, s: '', ping: null, settings: null, relay: '', token: '', me: null };

/* ---------- 작은 도구 ---------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3200); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dueText(due) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(due || '')) return '';
  var p = due.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]), t = new Date(); t.setHours(0, 0, 0, 0);
  var left = Math.round((d - t) / 86400000), day = '일월화수목금토'[d.getDay()];
  var base = p[1] + '월 ' + p[2] + '일(' + day + ')까지';
  return left > 0 ? base + ' · ' + left + '일 남음' : left === 0 ? base + ' · 오늘까지' : base;
}
// 견본 시트의 사본은 이름 끝에 '의 사본'이 붙으므로 화면에서는 떼고 보여 줌
function classTitle(t) { return String(t || '').replace(/\s*의 사본(\s*\(\d+\))?\s*$/, '').replace(/^Copy of\s+/i, '').trim(); }
function heightText(count, cm) {
  var m = count * cm / 100;
  if (m >= 1000) return (Math.round(m / 10) / 100) + 'km';
  return (Math.round(m * 10) / 10) + 'm';
}

/* ---------- 학교 시트(껍데기)와 주고받기 ---------- */
async function rpcOnce(fn, args) {
  var res = await fetch(APP.s, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) });
  if (!res.ok) { var e = new Error('학교 시트와 연결이 잠시 끊겼어요. (' + res.status + ')'); e.retry = true; throw e; }
  var out = await res.json();
  if (!out.ok) throw new Error(out.error || '요청을 처리하지 못했어요.');
  return out.result;
}
async function rpc(fn, args) {
  try { return await rpcOnce(fn, args); }
  catch (e) {
    if (!(e.retry || e instanceof TypeError)) throw e;
    await sleep(1500);
    try { return await rpcOnce(fn, args); } catch (e2) { throw (e2 instanceof TypeError) ? new Error('학교 시트와 연결하지 못했어요. 인터넷을 확인해 주세요.') : e2; }
  }
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(e.message || String(e)); return undefined; } }

/* ---------- 화면 바꾸기 ---------- */
var VIEWS = {};
function go(view) { if (location.hash !== '#' + view) location.hash = view; else render(); }
function render() {
  var v = (location.hash || '#home').slice(1);
  if (!VIEWS[v]) v = 'home';
  $('#modal').innerHTML = '';
  var nav = $('#nav');
  nav.innerHTML = v === 'home'
    ? '<button class="btn" type="button" data-go="student">책 기록하기</button><button class="btn line" type="button" data-go="admin">선생님</button>'
    : (v === 'admin' && APP.token) ? '' : '<button class="btn line" type="button" data-go="home">현황판</button>';
  VIEWS[v]();
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-go]');
  if (b) { ev.preventDefault(); if (b.getAttribute('data-go') === 'admin') ADMIN.tab = 'approve'; go(b.getAttribute('data-go')); }   // 선생님 화면은 늘 승인 탭부터
});
$('#home').addEventListener('click', function () { go('home'); });
window.addEventListener('hashchange', render);

/* ---------- 책탑 그림 ---------- */
var BOOKC = ['#D2604A', '#E39A4A', '#E8B84E', '#5E9C8A', '#7E9BB8', '#B8566B', '#F2E6D0'];
var PAGE = '#FFF8EA', SHADE = '#D8CCB2', INK = '#3E2C20', CREAM = '#FFFCF6';
function mix(c, t, k) {
  var a = [1, 3, 5].map(function (i) { return parseInt(c.slice(i, i + 2), 16); }), b = [1, 3, 5].map(function (i) { return parseInt(t.slice(i, i + 2), 16); });
  return '#' + a.map(function (v, i) { return Math.round(v * (1 - k) + b[i] * k).toString(16).padStart(2, '0'); }).join('');
}
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  while (fillPx - sum >= 14) { var hh = Math.min(pick(r, [16, 18, 20, 22, 26]), fillPx - sum); if (fillPx - sum - hh < 14 && fillPx - sum <= 30) hh = fillPx - sum; hs.push(hh); sum += hh; }
  if (!hs.length && fillPx > 0) hs.push(Math.max(8, fillPx));
  var out = ['<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="우리 반 책탑"><line x1="0" y1="1" x2="' + W + '" y2="1" stroke="#E8B84E" stroke-width="2" stroke-dasharray="6 5"/>'];
  function lines(a, b) { var o = [], t = a + 1.4; while (t < b - 0.8) { o.push(t); t += pick(r2, [1.8, 2.2, 2.6]); } return o; }
  var y = H, prevC = '', prevO = '', ti = 0, k = 0;
  hs.forEach(function (h) {
    y -= h;
    var o = pick(r, 'SNEW'.split('').filter(function (x) { return x !== prevO; }).concat(['S'])); prevO = o;
    var c = pick(r, BOOKC.filter(function (x) { return x !== prevC; })); prevC = c;
    var wide = (o === 'S' || o === 'N'), w = pick(r, wide ? [108, 116, 124, 130] : [70, 76, 84]), dx = wide ? 16 : 34, dy = wide ? -8 : -17;
    var x = Math.round((W - (w + dx)) / 2 + Math.floor(r() * 17) - 8), top = mix(c, '#FFFFFF', 0.35), cd = mix(c, INK, 0.14), CV = Math.min(3, h / 4);
    function side(t0, t1, a, b, f) { var X = function (t) { return (x + w + dx * t).toFixed(1); }, Y = function (t, off) { return (y + dy * t + off).toFixed(1); }; return '<polygon points="' + X(t0) + ',' + Y(t0, a) + ' ' + X(t1) + ',' + Y(t1, a) + ' ' + X(t1) + ',' + Y(t1, b) + ' ' + X(t0) + ',' + Y(t0, b) + '" fill="' + f + '"/>'; }
    out.push('<polygon points="' + x + ',' + y + ' ' + (x + w) + ',' + y + ' ' + (x + w + dx) + ',' + (y + dy) + ' ' + (x + dx) + ',' + (y + dy) + '" fill="' + top + '"/>');
    var title = titles.length ? String(titles[ti % titles.length] || '') : '';
    if (o === 'E') {
      out.push(side(0, 1, 0, h, cd));
      var st = title.replace(/\s/g, '').slice(0, 3);
      if (st && h >= 12) { ti++; var fs = Math.min(8.5, h - 5, (dx - 5) / st.length - 1), adv = fs + 1, cu = (dx - st.length * adv) / 2 + adv / 2;
        out.push('<g transform="matrix(1 ' + (dy / dx).toFixed(3) + ' 0 1 ' + (x + w) + ' ' + y + ')" font-family="Jua,sans-serif" font-size="' + fs.toFixed(1) + '" fill="' + inkOn(c) + '" text-anchor="middle" dominant-baseline="central" aria-hidden="true">');
        st.split('').forEach(function (ch) { out.push('<text x="' + cu.toFixed(1) + '" y="' + (h / 2).toFixed(1) + '" transform="rotate(-90 ' + cu.toFixed(1) + ' ' + (h / 2).toFixed(1) + ')">' + esc(ch) + '</text>'); cu += adv; });
        out.push('</g>'); }
    } else {
      var t0 = o === 'S' ? 0 : 0.08;
      out.push(side(0, 1, 0, h, SHADE) + side(t0, 0.92, CV, h - CV, PAGE));
      out.push('<path d="' + lines(y + CV, y + h - CV).map(function (yy) { return 'M' + (x + w + dx * t0).toFixed(1) + ' ' + (yy + dy * t0).toFixed(1) + 'L' + (x + w + dx * 0.92).toFixed(1) + ' ' + (yy + dy * 0.92).toFixed(1); }).join('') + '" stroke="#8A7A5C" stroke-opacity=".35" stroke-width=".6" fill="none"/>');
      out.push(side(0, 1, 0, CV, cd) + side(0, 1, h - CV, h, cd));
    }
    if (o === 'S') {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" fill="' + c + '"/>');
      var flip = (k % 4 === 3); k++;
      out.push('<rect x="' + (flip ? x + w - 10.5 : x + 8) + '" y="' + y + '" width="2.5" height="' + h + '" fill="' + inkOn(c) + '" opacity=".35"/>');
      var maxCh = Math.floor((w - 34) / 8), tt = title.length > maxCh ? title.slice(0, maxCh) : title;
      if (tt && h >= 12) { ti++;
        var units = tt.split('').reduce(function (a, ch) { return a + (ch === ' ' ? 0.45 : 1); }, 0), fs2 = Math.min(12, h - 5, (w - 34) / units - 1), adv2 = fs2 + 1, cy = y + h / 2, cx = flip ? x + w - 20 - fs2 : x + 20;
        out.push('<g font-family="Jua,sans-serif" font-size="' + fs2.toFixed(1) + '" fill="' + inkOn(c) + '" text-anchor="middle" dominant-baseline="central" aria-hidden="true">');
        tt.split('').forEach(function (ch) {
          if (ch === ' ') { cx += (flip ? -1 : 1) * adv2 * 0.45; return; }
          var px = (cx + fs2 / 2).toFixed(1);
          out.push('<text x="' + px + '" y="' + cy.toFixed(1) + '" transform="rotate(' + (flip ? 90 : -90) + ' ' + px + ' ' + cy.toFixed(1) + ')">' + esc(ch) + '</text>'); cx += (flip ? -1 : 1) * adv2;
        });
        out.push('</g>'); }
    } else {
      var l = x + (o === 'W' ? 5 : 4), rr = x + w - (o === 'E' ? 5 : 4);

      out.push('<path d="' + lines(y + CV, y + h - CV).map(function (yy) { return 'M' + l + ' ' + yy.toFixed(1) + 'H' + rr; }).join('') + '" stroke="#8A7A5C" stroke-opacity=".35" stroke-width=".6" fill="none"/>');

function compareSvg(g) {

      for (var c = 0; c < 3; c++) {

        o.push('<rect x="' + (bx + 8 + c * 23) + '" y="' + (y + fh * 0.25).toFixed(1) + '" width="16" height="' + (fh * 0.45).toFixed(1) + '" rx="1" fill="' + (((f * 3 + c) % 4 === 1) ? '#FBEBC4' : '#6E5847') + '"/>');

    o.push('<rect x="32" y="192" width="56" height="96" rx="2" fill="#FBEBC4"/><rect x="26" y="330" width="108" height="150" rx="2" fill="none" stroke="#A08C72" stroke-width="3"/><circle cx="130" cy="345" r="5" fill="#6E5847"/>');
    o.push('<rect x="96" y="124" width="50" height="22" rx="3" fill="#FBEBC4"/><rect x="104" y="133" width="34" height="4" rx="2" fill="#6E5847"/>');
  } else if (g.kind === 'sky') {

  } else {

}

      $('#modal').innerHTML = '<div class="shade"><form class="sheet" id="rsf"><h2>책 기록 모두 지우기</h2><p style="margin:0">정말 지우려면 아래 칸에 <b>지우기</b> 라고 적어 주세요.</p><label class="f" for="rsw">확인</label><input class="in" id="rsw" autocomplete="off"><button class="btn wide" type="submit">모두 지우기</button><button class="btn line wide" type="button" id="rsx">취소</button></form></div>';
      $('#rsw').focus(); $('#rsx').onclick = function () { $('#modal').innerHTML = ''; };
      $('#rsf').onsubmit = function (ev) { ev.preventDefault(); if ($('#rsw').value.trim() !== '지우기') { toast('"지우기" 라고 적어 주세요.'); return; } act('resetBooks', [], '책 기록을 모두 지웠어요.'); };
    };
    $('#pf').onsubmit = async function (ev) { ev.preventDefault(); var r2 = await guard(function () { return rpc('changeAdminPassword', [APP.token, $('#npw').value]); }); if (!r2) return; if (!r2.ok) { toast(r2.message); return; } APP.pwDefault = false; toast('비밀번호를 바꿨어요.'); render(); };
  },
  log: async function (el, d) {
    el.innerHTML = '<p class="muted" style="margin-top:0">화면 ' + APP.version + ' · 껍데기 ' + d.shell + '판</p>' +
      (d.shell < APP.latestShell ? '<div class="item" id="shup" style="background:var(--butter);margin-bottom:14px"><strong>껍데기 새 판(' + APP.latestShell + '판)이 나왔어요</strong><p style="margin:6px 0">지금 껍데기(' + d.shell + '판)로도 쓸 수 있지만, 학급 이름 정하기·대기 기록 지우기·책 기록 초기화는 새 판에서 됩니다.</p><ol style="margin:0;padding-left:20px"><li><a href="https://github.com/MusicalPE/readus/blob/main/Shell.gs" target="_blank" rel="noopener">새 Shell.gs</a> 내용을 통째로 복사합니다.</li><li><a href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">우리 반 시트</a> → 확장 프로그램 → Apps Script 에서 내용을 모두 지우고 붙여 넣은 뒤 저장합니다.</li><li>배포 → <b>배포 관리</b> → 연필(수정) → 버전: <b>새 버전</b> → 배포. (새 배포를 만들면 주소가 바뀌니 꼭 배포 관리에서)</li></ol></div>' : '') + '<div id="logl" class="stack"><span class="muted">불러오는 중이에요.</span></div>';
    try {
      var list = await (await fetch('changelog.json', { cache: 'no-cache' })).json();
      if (!$('#logl')) return;
      $('#logl').innerHTML = list.map(function (v, i) { return '<details class="item"' + (i === 0 ? ' open' : '') + '><summary><strong>' + esc(v.version) + '</strong> <span class="muted">' + esc(v.date) + '</span></summary><ul style="margin:8px 0 0;padding-left:20px">' + v.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>'; }).join('');
    } catch (e) { if ($('#logl')) $('#logl').innerHTML = '<span class="muted">업데이트 내역을 불러오지 못했어요.</span>'; }
  }
};

/* ---------- 시작 ---------- */
function connectScreen(msg) {
  $('#nav').innerHTML = '';
  $('#app').innerHTML = '<form class="card" id="cn" style="max-width:560px;margin:0 auto"><h1 style="font-size:22px">학교 시트와 연결하기</h1><p>' + esc(msg || '선생님이 알려 준 주소로 들어오면 바로 열려요. 처음 설치하는 선생님은 껍데기를 배포하고 받은 주소(…/exec)를 아래에 붙여 넣어 주세요.') + '</p><label class="f" for="su">껍데기 주소</label><input class="in" id="su" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><button class="btn wide" type="submit" style="margin-top:12px">연결</button></form>' +
    '<div class="card" style="max-width:560px;margin:14px auto 0"><strong style="font-size:17px">처음 설치하는 선생님</strong><p>껍데기가 들어 있는 견본 시트의 사본을 만들면 붙여 넣기 없이 바로 배포할 수 있어요.</p><a class="btn wide" id="tpl" href="' + TEMPLATE_URL + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">견본 시트 사본 만들기</a><p class="muted">사본을 만든 뒤 확장 프로그램 → Apps Script → 배포 → 새 배포(웹 앱)까지 하면 주소가 나옵니다. <a href="https://github.com/MusicalPE/readus#readme" target="_blank" rel="noopener">설치 방법 자세히 보기</a></p></div>';
  $('#cn').onsubmit = function (ev) {
    ev.preventDefault();
    var u = $('#su').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u) && !/^http:\/\/localhost[:/]/.test(u)) { toast('…/exec 로 끝나는 껍데기 주소를 넣어 주세요.'); return; }
    location.search = '?s=' + encodeURIComponent(u);
  };
}
async function start() {
  $('#ver').textContent = APP.version;
  var q = new URLSearchParams(location.search), s = q.get('s') || '';
  try { if (!s) s = localStorage.getItem('ru_shell') || ''; } catch (e) {}
  if (!s) { connectScreen(); return; }
  APP.s = s;
  try {
    var got = await Promise.all([rpc('ping'), rpc('getSettings')]);
    APP.ping = got[0]; APP.settings = got[1];
  } catch (e) { connectScreen('학교 시트와 연결하지 못했어요. 주소를 다시 확인해 주세요. (' + (e.message || e) + ')'); return; }
  try { localStorage.setItem('ru_shell', s); APP.token = sessionStorage.getItem('ru_token|' + s) || ''; } catch (e) {}
  $('#cls').textContent = classTitle(APP.ping.title);
  if (APP.ping.shell < APP.requiredShell) toast('껍데기를 새 판으로 바꿔야 해요. 선생님께 알려 주세요.');
  try { var rj = await (await fetch('relay.json', { cache: 'no-cache' })).json(); if (/^https?:\/\//.test(rj.relay || '')) APP.relay = rj.relay; } catch (e) {}
  render();
}
start();
</script>
